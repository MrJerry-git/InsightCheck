[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xunying-api"
version = "0.1.0"
description = "循影定检后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
research = [
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
